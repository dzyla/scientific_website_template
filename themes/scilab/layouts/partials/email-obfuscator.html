{{- /*
  Renders an email address that is assembled by JS (see initEmailObfuscation
  in main.js) rather than sitting in the markup as a harvestable mailto:.

  Every variant carries a <noscript> fallback. Without one the address simply
  did not exist for anyone with JS off or blocked — the span rendered empty,
  so the contact page showed the label "Email" followed by nothing. The
  fallback uses the [at]/[dot] spelling: readable by a person, still not a
  plain mailto: for a naive regex harvester.

  @context {string} address  The real address.
  @context {string} display  Optional link text; defaults to the address.
  @context {string} class    Optional extra classes.
*/ -}}
{{- $address := .address -}}
{{- $display := .display | default $address -}}
{{- $class := .class | default "" -}}
{{- $isEmailText := eq $display $address -}}

{{- /* dawid.zyla@cuanschutz.edu -> dawid.zyla [at] cuanschutz.edu */ -}}
{{- $readable := replace $address "@" " [at] " -}}

{{- if $isEmailText -}}
<span class="__cf_email__ {{ $class }}" data-cfemail="{{ $address | base64Encode }}"></span>
<noscript><span class="email-fallback">{{ $readable }}</span></noscript>
{{- else -}}
<a href="#" class="__cf_email__ {{ $class }}" data-cfemail="{{ $address | base64Encode }}" data-display="{{ $display }}">{{ $display | safeHTML }}</a>
{{/* Plain text, not the button classes: a styled pill that cannot be
     clicked is worse than a legible address. */}}
<noscript><span class="email-fallback">{{ $readable }}</span></noscript>
{{- end -}}
