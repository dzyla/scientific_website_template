{{- $styles := slice
    (resources.Get "css/main.css")
    (resources.Get "css/nav.css")
    (resources.Get "css/hero.css")
    (resources.Get "css/news.css")
    (resources.Get "css/custom.css")
-}}
{{- $bundle := $styles | resources.Concat "css/site.css" | resources.Minify | resources.Fingerprint -}}

<link rel="preload" href="{{ $bundle.RelPermalink }}" as="style">
<link rel="stylesheet" href="{{ $bundle.RelPermalink }}" integrity="{{ $bundle.Data.Integrity }}" crossorigin="anonymous">
