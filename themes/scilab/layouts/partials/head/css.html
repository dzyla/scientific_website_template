{{- $styles := slice
    (resources.Get "css/main.css")
    (resources.Get "css/nav.css")
    (resources.Get "css/hero.css")
    (resources.Get "css/news.css")
    (resources.Get "css/custom.css")
-}}
{{- $bundle := $styles | resources.Concat "css/site-v2.css" | resources.Minify | resources.Fingerprint -}}

<style>
  :root {
    --highlight-color: {{ site.Params.highlightColor | default "#b78b2c" }};
    --highlight-text-color: {{ site.Params.highlightTextColor | default "#271400" }};
  }
</style>

<link rel="stylesheet" href="{{ $bundle.RelPermalink }}" integrity="{{ $bundle.Data.Integrity }}">
