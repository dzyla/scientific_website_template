{{ define "main" }}
  <section class="section error-404" aria-labelledby="error-404-title">
    <span class="section-eyebrow">Error 404</span>
    <h1 id="error-404-title">This page wandered off</h1>
    <div class="section-divider" aria-hidden="true"></div>
    <p class="error-404-lead">
      The page you were looking for doesn’t exist or may have moved. Let’s get you back on track.
    </p>
    <nav class="error-404-links hero-buttons-row" aria-label="Helpful links">
      <a class="hero-btn btn-primary-gold" href="{{ site.BaseURL }}">Back to home</a>
      {{ range site.Menus.main }}
        <a class="hero-btn btn-secondary-black" href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </section>
{{ end }}
