<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
    {{ partial "head.html" . }}
    <body>
        <a class="skip-link" href="#main-content">Skip to content</a>
        {{ partial "header.html" . }}
        <main id="main-content" class="main" tabindex="-1">
            <div class="container">
                {{ block "main" . }}{{ end }}
            </div>
        </main>
        <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">
            ↑
        </button>
        {{ partial "footer.html" . }}
    </body>
</html>
