<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
    {{ partial "head.html" . }}
    <body>
        <a href="#main-content" class="skip-link">Skip to main content</a>
        <div id="reading-progress" class="reading-progress" role="progressbar" aria-hidden="true"></div>
        {{ partial "header.html" . }}
        <main id="main-content" class="main">
            <div class="container">
                {{ block "main" . }}{{ end }}
            </div>
        </main>
        <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">
            ↑
        </button>
        {{ partial "footer.html" . }}
    </body>
</html>
