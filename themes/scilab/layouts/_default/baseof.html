<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
    {{ partial "head.html" . }}
    <body>
        <a href="#main-content" class="skip-link">Skip to content</a>
        {{ partial "header.html" . }}
        <main class="main" id="main-content">
            <div class="container">
                {{ block "main" . }}{{ end }}
            </div>
        </main>
        <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">
            ↑
        </button>
        {{ partial "footer.html" . }}
    </body>
</html>
