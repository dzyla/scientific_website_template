# ============================================================
# Hugo configuration — SciLab theme
# Template: replace every value tagged [TEMPLATE] with your
# own lab's information. Remove or comment out any optional
# sections your lab doesn't need.
# ============================================================

baseURL = "https://zylalab.org/"          # [TEMPLATE] your site URL
languageCode = "en-us"
title = "Zyla Lab"                         # [TEMPLATE] your lab name
theme = "scilab"

[params]
  # ── Accent color ──────────────────────────────────────────
  # highlightColor drives nav active-state, buttons, and links.
  # Choose a color that meets WCAG AA contrast on white (#fff).
  highlightColor = "#8B6508"         # [TEMPLATE] dark goldenrod/ochre
  highlightTextColor = "#ffffff"     # text color when used as button bg

  # ── Basic identity ────────────────────────────────────────
  description = "Structural Dynamics of Molecular Machines"  # [TEMPLATE]
  tagline = "Structural Dynamics of Molecular Machines"       # [TEMPLATE]
  keywords = ["Structural Biology", "Virology", "Biophysics", "Cryo-EM", "Measles Virus", "Protein Dynamics", "Zyla Lab", "University of Colorado Anschutz"]
  social_image = "images/fectoFab_export2.png"
  twitter_handle = "@DawidZyla"
  author = "Dawid S. Zyla"

  ga4MeasurementID = "G-22NWJXHMQX"  # set your GA4 ID here
  # Use one or more verification tokens below after you register each service.
  verification_google = "Vz7Gl-n9zkRCK3_l9C9CIi_8NGHjg_BzTH-z7jQwHSY"           # e.g., "abc123..."
  verification_bing = "61B74CA254AA5A274DBB1A3E21C33827"             # e.g., "BingSiteAuthCode"
  verification_yandex = "08f69a50ba6c41ce"           # optional
  organization_name = "Zyla Lab"
  organization_logo = "/favicon.svg"
  organization_url  = "https://zylalab.org/"
  # Institution shown in footer branding column
  institution_name = "University of Colorado Anschutz"
  institution_department = "Department of Biochemistry and Molecular Genetics"
  institution_url = "https://medschool.cuanschutz.edu/biochemistry"
  institution_logo = "images/cuanschutz_h_clr.tmb-ze-450-450.png"
  joinURL = "/contact/"
  joinLabel = "Join us"
  contact_email = "dawid.zyla@cuanschutz.edu"
  contact_phone = "+1 (555) 123-4567"
  contact_hours = "Mon–Fri · 9:00–17:00 PT"
  scholar = "https://scholar.google.com/citations?user=dEGnzrwAAAAJ&hl=en"
  orcid = "https://orcid.org/0000-0001-8471-469X"
  github = "https://github.com/dzyla"
  linkedin = "https://www.linkedin.com/in/dawidzyla/"
  bluesky = "https://bsky.app/profile/dzyla.bsky.social"

  [params.robots]
    disallow_paths = []
    allow_paths = ["/"]

  [params.address]
    building = "Research I South"
    department = "Department of Biochemistry and Molecular Genetics"
    institution = "University of Colorado Anschutz Medical Campus"
    street = "12801 East 17th Avenue Mail Stop 8101"
    city = "Aurora"
    state = "CO"
    zip = "80045"
    country = "USA"

  [params.home]
    [params.home.hero]
      title = "Structural Dynamics of Molecular Machines"
      lead = "We integrate structural biology and biophysics to capture the transient dynamics of molecular machines, revealing the structural mechanisms of disease."
      intro = []
      carousel = [
        "images/fectoFab_export2.png",
        "images/P6-S43-5554.png",
        "images/2d_grid.png",
        "images/spark3.png",
      ]
      actionsAria = "Primary site sections"

      [[params.home.hero.actions]]
        label = "Research Areas"
        pageRef = "research"

      [[params.home.hero.actions]]
        label = "Recent Publications"
        pageRef = "publications"

      [[params.home.hero.actions]]
        label = "Join the Lab"
        pageRef = "contact"

    [params.home.news]
      heading = "Latest News"
      description = "Insights and announcements from the lab."
      section = "news"
      limit = 0
      showSummaries = true

  [[params.footer_links]]
    name = "Research"
    pageRef = "research"

  [[params.footer_links]]
    name = "Publications"
    pageRef = "publications"

  [[params.footer_links]]
    name = "Team"
    pageRef = "team"

  [[params.footer_links]]
    name = "Contact"
    pageRef = "contact"

canonifyURLs = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Respect user privacy while keeping analytics useful
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true
    useSessionStorage = false
  [privacy.youtube]
    privacyEnhanced = true

[menu]
  [[menu.main]]
    name = "Research"
    pageRef = "research"
    weight = 1

  [[menu.main]]
    name = "Team"
    pageRef = "team"
    weight = 2

  [[menu.main]]
    name = "Publications"
    pageRef = "publications"
    weight = 3

  [[menu.main]]
    name = "Resources"
    pageRef = "resources"
    weight = 4

  [[menu.main]]
    name = "Philosophy"
    pageRef = "philosophy"
    weight = 5

  [[menu.main]]
    name = "Contact"
    pageRef = "contact"
    weight = 6
