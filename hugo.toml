# ============================================================
# Zyla Lab — site configuration
# University of Colorado Anschutz Medical Campus
# ============================================================

baseURL = "https://zylalab.org/"
languageCode = "en-us"
title = "Zyla Lab"
theme = "scilab"

enableRobotsTXT = true        # emit /robots.txt from layouts/robots.txt
enableGitInfo = false

# /categories/ was never used and only produced an empty listing page.
[taxonomies]
  tag = "tags"

[params]
  # ── Accent color ──────────────────────────────────────────
  # highlightColor drives nav active-state, buttons, and links.
  # Must meet WCAG AA (4.5:1) against white; #8B6508 measures 5.3:1.
  # The dark-theme counterpart lives in assets/css/custom.css.
  highlightColor = "#8B6508"
  highlightTextColor = "#ffffff"     # text color when used as button bg

  # ── Basic identity ────────────────────────────────────────
  description = "The Zyla Lab at the University of Colorado Anschutz combines cryo-EM, biophysics and computation to capture how viral fusion proteins and other molecular machines change shape to do their work."
  tagline = "Structural Dynamics of Molecular Machines"
  keywords = ["Structural Biology", "Virology", "Biophysics", "Cryo-EM", "Measles Virus", "Protein Dynamics", "Zyla Lab", "University of Colorado Anschutz"]
  social_image = "images/fectoFab_export2.png"
  social_image_alt = "Molecular models of trimeric viral fusion protein ectodomains bound by antibody Fab fragments."
  twitter_handle = "@DawidZyla"
  author = "Dawid S. Zyla"

  ga4MeasurementID = "G-22NWJXHMQX"

  # Search-console ownership tokens.
  verification_google = "Vz7Gl-n9zkRCK3_l9C9CIi_8NGHjg_BzTH-z7jQwHSY"
  verification_bing = "61B74CA254AA5A274DBB1A3E21C33827"
  verification_yandex = "08f69a50ba6c41ce"
  organization_name = "Zyla Lab"
  organization_logo = "/favicon.svg"
  organization_url  = "https://zylalab.org/"
  # Institution shown in footer branding column
  institution_name = "University of Colorado Anschutz"
  institution_department = "Department of Biochemistry and Molecular Genetics"
  institution_url = "https://medschool.cuanschutz.edu/biochemistry"
  institution_logo = "images/cuanschutz_h_clr.tmb-ze-450-450.png"
  contact_email = "dawid.zyla@cuanschutz.edu"
  contact_phone = "303-724-3201"
  contact_hours = "Mon–Fri · 9:00–17:00 MT"
  scholar = "https://scholar.google.com/citations?user=dEGnzrwAAAAJ&hl=en"
  orcid = "https://orcid.org/0000-0001-8471-469X"
  github = "https://github.com/dzyla"
  linkedin = "https://www.linkedin.com/in/dawidzyla/"
  bluesky = "https://bsky.app/profile/dzyla.bsky.social"

  [params.robots]
    disallow_paths = []
    allow_paths = ["/"]

  [params.address]
    building = "Research I South"
    room = "Room L18-10-122"
    department = "Department of Biochemistry and Molecular Genetics"
    institution = "University of Colorado Anschutz Medical Campus"
    street = "12801 East 17th Avenue Mail Stop 8101"
    city = "Aurora"
    state = "CO"
    zip = "80045"
    country = "USA"

  [params.home]
    [params.home.hero]
      title = "Structural Dynamics of Molecular Machines"
      lead = "We integrate structural biology and biophysics to capture the transient dynamics of molecular machines, revealing the structural mechanisms of disease."
      intro = []
      # Each slide carries real alt text: it is read aloud by screen readers
      # and is the only description search engines get for these images.
      carousel = [
        { src = "images/fectoFab_export2.png", alt = "Molecular models of trimeric viral fusion protein ectodomains in green, several of them bound by antibody Fab fragments in blue." },
        { src = "images/P6-S43-5554.png", alt = "Raw cryo-electron microscopy micrograph showing individual protein particles suspended in vitreous ice." },
        { src = "images/2d_grid.png", alt = "Grid of two-dimensional cryo-EM class averages showing a three-lobed complex viewed in many different orientations." },
        { src = "images/spark3.png", alt = "Illustration of teal and pink antibodies engaging the densely packed glycoprotein surface of a virus particle." },
      ]
      actionsAria = "Primary site sections"

      [[params.home.hero.actions]]
        label = "Research Areas"
        pageRef = "research"

      [[params.home.hero.actions]]
        label = "Recent Publications"
        pageRef = "publications"

      [[params.home.hero.actions]]
        label = "Join the Lab"
        pageRef = "contact"

    [params.home.news]
      heading = "Latest News"
      description = "Insights and announcements from the lab."
      section = "news"
      limit = 6          # 0 shows every post; the rest live at /news/
      showSummaries = true

  [[params.footer_links]]
    name = "Research"
    pageRef = "research"

  [[params.footer_links]]
    name = "Publications"
    pageRef = "publications"

  [[params.footer_links]]
    name = "News"
    pageRef = "news"

  [[params.footer_links]]
    name = "Team"
    pageRef = "team"

  [[params.footer_links]]
    name = "Contact"
    pageRef = "contact"

canonifyURLs = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# Respect user privacy while keeping analytics useful
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true
    useSessionStorage = false
  [privacy.youtube]
    privacyEnhanced = true

[menu]
  [[menu.main]]
    name = "Research"
    pageRef = "research"
    weight = 1

  [[menu.main]]
    name = "Team"
    pageRef = "team"
    weight = 2

  [[menu.main]]
    name = "Publications"
    pageRef = "publications"
    weight = 3

  [[menu.main]]
    name = "Resources"
    pageRef = "resources"
    weight = 4

  [[menu.main]]
    name = "Philosophy"
    pageRef = "philosophy"
    weight = 5

  [[menu.main]]
    name = "Contact"
    pageRef = "contact"
    weight = 6
