hero:
  title: "Structural Dynamics of Molecular Machines"
  intro: "Biological function is driven by motion. We combine structural biology, biophysics, and AI to visualize molecular machines in action. By capturing the fleeting intermediate states of membrane fusion and assembly, we reveal new targets for therapeutic intervention."

topics:
  - title: "Visualizing Membrane Fusion"
    description: "We use advanced imaging to see how proteins remodel membranes. Using viral entry as a model system, we map the complex machinery that drives fusion and cellular infection."
  - title: "Capturing Transient States"
    description: "Proteins are not static structures. We track the fleeting conformational changes—from prefusion to postfusion—to understand how molecular machines perform work."
  - title: "Developing next-gen tools"
    description: "We engineer novel antibody probes and native-membrane environments (VLPs) to trap specific protein states, creating better platforms for structure-based drug design."

projects:
  title: "Our Research Focus"
  items:
    - title: "Structural Basis of Fusion"
      summary: "Using cryo-electron microscopy, we map the detailed structures of viral fusion complexes to understand how they merge viral and cellular membranes and how immune systems can block this process."
      image: "images/proteinchaos.png"
      caption: "High-resolution architecture of viral entry complexes"
    - title: "Time-Resolved Structural Biology"
      summary: "We are developing time-resolved techniques to freeze-frame protein dynamics during reaction, capturing the elusive intermediate steps that traditional methods miss."
      image: "images/chaos_vc_FPOST_charcoal.png"
      caption: "Capturing the dynamic steps of viral fusion"
    - title: "Structure-Guided Therapeutic Design"
      summary: "By understanding the natural shape-shifting of viral proteins, we use AI and structural insights to design smarter vaccines and potent fusion-arresting antibodies."
      image: "images/chaos_vc_FECTO2M__ink.png"
      caption: "Structure-based design of new therapeutics"
