hero:
  title: "Structure-guided virology and biophysics"
  intro: "We combine structural biology and biophysics to understand molecular machines that drive virus entry. By capturing viral proteins in action, we aim to uncover the mechanisms of infection and inspire new antiviral strategies."

topics:
  - title: "Visualizing viral entry"
    description: "We use advanced imaging to see how viruses attach to and penetrate cells, revealing the complex machinery they use to invade."
  - title: "Capturing dynamic movements"
    description: "Proteins are not static; they move and change shape. We track these fleeting moments to understand how proteins carry out their functions."
  - title: "Developing next-gen tools"
    description: "We engineer new ways to study pathogens in their native environment, creating better platforms for vaccine design and drug discovery."

projects:
  title: "Our Research Focus"
  items:
    - title: "Decoding the fusion machinery"
      summary: "Using cryo-electron microscopy, we map the detailed structures of viral fusion complexes to understand how they merge viral and cellular membranes and how immune systems can block this process."
      image: "images/proteinchaos.png"
      caption: "High-resolution architecture of viral entry complexes"
    - title: "Watching viruses in motion"
      summary: "We are developing time-resolved techniques to freeze-frame viral proteins during infection, capturing the elusive intermediate steps of the fusion process."
      image: "images/chaos_vc_FPOST_charcoal.png"
      caption: "Capturing the dynamic steps of viral fusion"
    - title: "Innovating for cures"
      summary: "By understanding the natural shape of viral proteins, we use AI and structural insights to design smarter vaccines and potent antiviral therapies."
      image: "images/chaos_vc_FECTO2M__ink.png"
      caption: "Structure-based design of new therapeutics"