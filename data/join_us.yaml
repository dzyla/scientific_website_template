intro: "We're always glad to hear from prospective students, postdocs, and collaborators. The roles below describe the kinds of scientists we recruit and what we look for in each — specific openings are announced in the [news feed](/news/). Even when nothing is formally advertised, reach out and tell us about your research interests and experience."

positions:
  - title: "PhD Student"
    bullets:
      - "Interested in solving difficult biological problems with creativity and resilience."
      - "Willing to learn—we teach structural biology, biophysics, and protein chemistry from scratch."
      - "Background in biochemistry or computational biology is welcome, but initiative is key."

  - title: "Postdoctoral Researcher"
    bullets:
      - "PhD in structural biology, virology, or a related field."
      - "Ready to lead independent projects and supervise junior team members."
      - "Expertise in cryo-EM, tomography, or kinetic assays is highly valued."

  - title: "Research Specialist"
    bullets:
      - "BS or MS in a relevant field with strong organizational skills."
      - "Willing to support diverse projects (e.g., protein purification, cell culture)."
      - "Enthusiastic about helping maintain smooth lab operations."

cta:
  text: "All graduate student applications should be submitted through the University of Colorado Anschutz graduate school admissions process. <br><br> For general inquiries, please email us."
