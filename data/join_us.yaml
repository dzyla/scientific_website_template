intro: "We're always excited to meet scientists who want to combine structural biology and virology. If one of the roles below resonates with you, send a short email introducing yourself along with a CV and highlight project."
positions:
  - title: "PhD Student"
    bullets:
      - "Strong foundation in biochemistry, molecular biology, or biophysics"
      - "Hands-on experience in cryo-EM sample prep, tomography, or related imaging"
      - "Comfortable writing Python or R scripts for data analysis and reproducibility"
      - "Collaborative mindset—you’ll co-mentor undergraduates and work closely with postdocs"
  - title: "Postdoctoral Researcher"
    bullets:
      - "PhD in structural biology, virology, or biophysics with a published record of cryo-EM or structural studies"
      - "Deep expertise in single-particle analysis, subtomogram averaging, or hybrid modeling"
      - "Interest in translating structural insights into antiviral screening or mechanistic models"
      - "Ready to drive an independent project while mentoring students"
  - title: "Lab Technician"
    bullets:
      - "BS or MS in a relevant field with 2+ years of wet-lab experience"
      - "Skilled in cell culture, protein purification, and general lab operations"
      - "Experienced with instrument scheduling, inventory, and safety compliance"
      - "Enthusiastic about enabling collaborative experiments and keeping the lab running smoothly"
cta:
  text: "To apply, email hello@biolab.edu with ‘Bio Lab Opportunity’ in the subject line."
